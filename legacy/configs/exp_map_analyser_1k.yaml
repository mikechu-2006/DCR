# osumania_map_analyser 特征作为冻结谱面特征（与 exp_minacalc_1k.yaml 的 L1 是同一个模型）。
#
# 前置资产（已产出可跳过）：data/processed/map_analyser_1k.parquet
#   python scripts/step0i_map_analyser.py --tag 1k --ids data/processed/whitelist_1k.csv \
#       --cache data/osu_cache --out data/processed/map_analyser_1k.parquet --jobs 3
# 或者把 step0/map_analyser 加进这个 config 一起跑（需要 Node + external/osumania_map_analyser）。
#
#   python main.py -c configs/exp_map_analyser_1k.yaml
#   python main.py -c configs/exp_map_analyser_1k.yaml --set steps.step2.params.feat_groups=ett \
#       --set name=mma_ett
#
# 设计见 docs/step2_map_analyser.md。模型与 step2/minacalc_as_feature 完全一致：
#   L_hat = b0 + bu + bm + alpha . Z[m] + <P_u, C_unit[m]>
# 所以同一子集上的 bias 可直接与 L1/L2 的 bias 并排比较。
#
# 特征组（--feat-groups）：
#   ett    = 6 个 MinaCalc 版本 × 8 个 skillset（48 维）
#   est    = Sunny(+ppMetrics) / Daniel / Azusa / Roxy / SunnyWindow / Interlude（13 维）
#   patt   = 键型分析：模式标签、LN/HB 比例、SV、6 类核心键型的覆盖/BPM/importance（34 维）
#   struct = OD、BPM、时长、行数、和弦比、note/s、长按时长、break（14 维）
name: map_analyser_1k
tag: 1k
steps:
  step1:
    version: clean   # legacy play 级；默认口径是 pairbest（见 configs/exp_pairbest_1k.yaml）
    params:
      train_frac: 0.70
      split_method: pair-random
      split_seed: 20260928
      acc_floor: 0.90
      drop_frac: 0.30
      min_plays_per_player: 200  # 全表记录数 < 200 的玩家整人剔除（先于划分）
  step2:
    version: map_analyser
    params:
      # bias   = 同一谱面子集上的 step2/predict 基线（可直接比）
      # fc_add = 只有 alpha . Z 主效应（没有 P，没有交互）
      # fc     = 主效应 + 点积交互 <P_u, C_unit>
      models: [bias, fc_add, fc]
      feat_groups: ett,est,patt,struct
      feat_reduce: zscore     # raw / zscore / pca（pca 时 --dim 是主成分数）
      feat_main: true
      feat_bm: free           # feat = 去掉 bm[m]，谱面截距完全由特征生成
      dim: 109                # zscore/raw 时会被自动设成特征数；pca 时是主成分数
      epochs: 60
      p_drift: none
      save_preds: true       # 落盘测试预测，供 scripts/compare_preds.py 做配对 bootstrap
