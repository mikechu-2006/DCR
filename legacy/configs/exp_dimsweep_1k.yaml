# 维度扫描（低维端，legacy play 级 clean）：全流程 raw dump → step0 → step1 → step2。
# 默认 pairbest 口径见 configs/exp_pairbest_1k.yaml。
#   python main.py -c configs/exp_dimsweep_1k.yaml
#   python main.py -c configs/exp_dimsweep_1k.yaml --skip step0     # 复用缓存里的 step0
#   for d in 2 3 4 6 8; do python main.py -c configs/exp_dimsweep_1k.yaml \
#       --skip step0 --set name=dim$d --set steps.step2.params.dim=$d; done
name: dimsweep_1k
tag: 1k
steps:
  step0:
    version: preprocess
    params:
      dump_dir: data/raw/extracted/2026_09_01_performance_mania_top_1000
  step1:
    version: clean
    params:
      train_frac: 0.70          # 不写就是默认值：划分在 step1，见 docs/procedure.md §4.1
      split_method: pair-random
      split_seed: 20260928
      acc_floor: 0.90
      drop_frac: 0.30
      min_plays_per_player: 200  # 全表记录数 < 200 的玩家整人剔除（先于划分）
      formats: both
  step2:
    version: predict
    params:
      models: [mf_dot]
      dim: 6
      epochs: 40
